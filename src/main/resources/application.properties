spring.application.name=dlcsp

# Server
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# Database (secrets have no default, so the app refuses to start without them)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dlcsp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:dlcsp_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema: "update" for development. Production will use "validate" with Flyway (later step).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Security
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# First admin (created only if no users exist; leave empty after the first start)
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}